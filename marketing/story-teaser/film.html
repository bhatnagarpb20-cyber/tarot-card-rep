<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="fonts.css" />
<script src="cards.js"></script>
<style>
  :root {
    --void: #0f0a1a; --cream: #f7eedd; --hot: #ff5fa8; --sun: #ff6a2b; --acid: #ffd84a; --teal: #2fd1c0; --cobalt: #3d5bff; --lilac: #b9a2ff;
    --color-void: #0f0a1a; --color-void-sunk: #08050f; --color-cream: #f7eedd; --color-hot: #ff5fa8; --color-sun: #ff6a2b; --color-acid: #ffd84a;
    --color-teal: #2fd1c0; --color-cobalt: #3d5bff; --color-lilac: #b9a2ff; --radius-card: 28px; --font-display: Bricolage;
  }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--void); }
  #stage { position: absolute; inset: 0; overflow: hidden;
    background:
      radial-gradient(900px 700px at 15% 8%, rgba(255,95,168,.16), transparent 70%),
      radial-gradient(900px 900px at 100% 55%, rgba(61,91,255,.15), transparent 70%),
      var(--void); }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform, opacity; }
  .card { width: 600px; height: 1000px; border-radius: 28px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.55); background: #08050f; }
  .card > svg, .card > div, .card > div > svg { width: 100%; height: 100%; display: block; }
  .back { width: 600px; height: 900px; border-radius: 30px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.55); background: #08050f; outline: 2px solid rgba(247,238,221,.25); }
  .back > div { width: 100%; height: 100%; }
  .back svg { width: 100%; height: 100%; display: block; }
  .serif { font-family: Gloock, serif; color: var(--cream); white-space: nowrap; }
  .sunset { background: linear-gradient(95deg, var(--hot), var(--sun) 55%, var(--acid)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sans { font-family: Bricolage, sans-serif; color: var(--cream); white-space: nowrap; }
  .orb { width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, var(--acid), var(--sun) 45%, var(--hot) 75%, rgba(255,95,168,0) 76%); }
  .orbglow { width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(255,95,168,.35), transparent 70%); }
  .star { width: 40px; height: 40px; }
  .pill { border: 2px solid rgba(247,238,221,.4); border-radius: 999px; padding: 18px 34px; }
</style>
</head>
<body>
<div id="stage">
  <div id="orbglow" class="abs orbglow"></div>
  <div id="orb" class="abs orb"></div>
  <div id="tInhale" class="abs serif" style="font-size:120px">inhale.</div>
  <div id="tExhale" class="abs serif" style="font-size:120px">exhale.</div>

  <div id="fan"></div>

  <div id="flip" class="abs" style="perspective:2400px; width:600px; height:1000px">
    <div id="flipInner" style="position:relative; width:600px; height:1000px; transform-style:preserve-3d">
      <div id="backFace" class="back" style="position:absolute; top:50px; left:0; backface-visibility:hidden"></div>
      <div id="frontFace" class="card" style="position:absolute; top:0; left:0; backface-visibility:hidden; transform:rotateY(180deg)"></div>
    </div>
  </div>
  <div id="sparkles"></div>

  <div id="tPull" class="abs serif" style="font-size:104px">pull a card.</div>
  <div id="t78" class="abs serif" style="font-size:84px"></div>

  <div id="lockup" class="abs" style="width:1080px">
    <div style="display:flex; flex-direction:column; align-items:center; gap:28px">
      <svg id="mark" viewBox="0 0 32 32" width="190" height="190">
        <circle cx="16" cy="16" r="15" fill="none" stroke="#2fd1c0" stroke-width="2"/>
        <circle cx="16" cy="16" r="11.5" fill="none" stroke="#ff5fa8" stroke-width="2"/>
        <circle cx="16" cy="16" r="8" fill="#ffd84a"/>
        <path d="M12.2 15.4c.9.8 1.9.8 2.8 0M17 15.4c.9.8 1.9.8 2.8 0" stroke="#0f0a1a" stroke-width="1.1" stroke-linecap="round" fill="none"/>
        <path d="M14.4 19c1 .7 2.2.7 3.2 0" stroke="#0f0a1a" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      </svg>
      <div class="serif" style="font-size:136px; letter-spacing:-0.02em; line-height:1">inhale <span style="color:var(--hot)">exhale</span></div>
    </div>
  </div>
  <div id="tTag" class="abs sans" style="font-size:44px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--acid)">tarot for beginners</div>
  <div id="s1a" class="abs serif" style="font-size:88px">I got curious</div>
  <div id="s1b" class="abs serif" style="font-size:88px">about <span class="sunset">tarot.</span></div>
  <div id="s2a" class="abs serif" style="font-size:88px">but couldn't find</div>
  <div id="s2b" class="abs serif" style="font-size:88px">the right resources.</div>
  <div id="s3a" class="abs serif" style="font-size:88px">so I vibe-coded</div>
  <div id="s3b" class="abs serif" style="font-size:88px"><span class="sunset">my own.</span></div>
</div>
<script>
// ---- timeline (60 fps, 120 BPM: beat = 30 f, bar = 120 f) ----
const T = {
  inhaleIn: 6, exhaleTurn: 150, exhaleIn: 162, breathEnd: 270,
  cardIn: 272, pullIn: 312, pullOut: 400,
  flip: 420, flipMid: 441, flipEnd: 470,
  fanStart: 540, fanOpen: 600, t78a: 594, t78b: 642, fanOut: 700,
  lockIn: 724, lockSettle: 784, tagIn: 800, urlIn: 828, end: 900,
};
window.TIMELINE = T;

// ---- easing ----
function bez(x1, y1, x2, y2) {
  return (t) => {
    if (t <= 0) return 0; if (t >= 1) return 1;
    let u = t;
    for (let i = 0; i < 8; i++) {
      const x = 3*(1-u)*(1-u)*u*x1 + 3*(1-u)*u*u*x2 + u*u*u - t;
      const dx = 3*(1-u)*(1-u)*x1 + 6*(1-u)*u*(x2-x1) + 3*u*u*(1-x2);
      if (Math.abs(dx) < 1e-6) break; u -= x / dx; u = Math.min(1, Math.max(0, u));
    }
    return 3*(1-u)*(1-u)*u*y1 + 3*(1-u)*u*u*y2 + u*u*u;
  };
}
const E = { out: bez(.16,1,.3,1), soft: bez(.22,1,.36,1), smooth: bez(.65,0,.35,1), inOut: bez(.87,0,.13,1), exit: bez(.55,.055,.675,.19), cam: bez(.48,.1,0,.9) };
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (f, a, b, ease = (x) => x) => ease(clamp((f - a) / (b - a)));
const mix = (a, b, t) => a + (b - a) * t;
const lmix = (a, b, t) => Math.exp(mix(Math.log(a), Math.log(b), t));
const $ = (id) => document.getElementById(id);

function place(el, x, y, s = 1, extra = '') {
  el.style.transform = `translate(${x}px, ${y}px) scale(${s}) ${extra}`;
}
function centerText(el, cx, cy, s = 1) {
  const w = el.offsetWidth, h = el.offsetHeight;
  place(el, cx - (w * s) / 2, cy - (h * s) / 2, s);
}
// Text fragment: rises 0.2 em on `out` over 36 f, exits whole over 24 f.
function fragment(el, f, inF, outF, cx, cy, size = 110) {
  const a = prog(f, inF, inF + 36, E.out);
  const z = outF == null ? 0 : prog(f, outF, outF + 24, E.exit);
  el.style.opacity = a * (1 - z);
  const rise = (1 - a) * 0.2 * size - z * 0.12 * size;
  const drift = Math.max(0, f - inF) * 0.25; // alive while read
  centerText(el, cx, cy + rise - drift * 0.4);
}

// ---- build fan and sparkles ----
const FAN = ['major-00-the-fool', 'major-01-the-magician', 'major-02-the-high-priestess', 'major-19-the-sun', 'major-18-the-moon', 'major-06-the-lovers'];
const fanEl = $('fan');
FAN.forEach((id) => {
  const d = document.createElement('div');
  d.className = 'abs card'; d.innerHTML = CARDS[id]; fanEl.appendChild(d);
});
$('backFace').innerHTML = CARDS.back;
$('frontFace').innerHTML = CARDS['major-17-the-star'];
const SP = [];
const spEl = $('sparkles');
const SPC = ['#ffd84a', '#ff5fa8', '#2fd1c0', '#f7eedd', '#ff6a2b'];
for (let i = 0; i < 22; i++) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 20 20'); s.setAttribute('class', 'abs');
  const size = 22 + (i % 3) * 14; s.setAttribute('width', size); s.setAttribute('height', size);
  s.innerHTML = `<path fill="${SPC[i % 5]}" d="M10 0c.9 5.2 4.8 9.1 10 10-5.2.9-9.1 4.8-10 10-.9-5.2-4.8-9.1-10-10C5.2 9.1 9.1 5.2 10 0z"/>`;
  spEl.appendChild(s);
  // deterministic spread
  SP.push({ el: s, size, angle: (i / 22) * Math.PI * 2 + (i % 2 ? 0.12 : -0.09), dist: 380 + (i % 4) * 70, delay: (i % 5) * 2 });
}

// ---- render ----
const CX = 540, CY = 860; // story-safe centre (IG UI covers ~0–220 and ~1640–1920)
// Story intro (her own words) runs before the ritual; the ritual's timeline is shifted by INTRO.
const INTRO = 540;
const STORY = [
  ['s1a', 6, 160, -40], ['s1b', 60, 160, 70],
  ['s2a', 190, 340, -40], ['s2b', 244, 340, 70],
  ['s3a', 370, 506, -40], ['s3b', 424, 506, 70],
];
window.TOTAL = INTRO + 900;
window.render = function (frame) {
  STORY.forEach(([id, a, z, dy]) => fragment($(id), frame, a, z, CX, CY + 380 + dy, 88));
  const f = frame - INTRO;
  // Background breathes very slowly, so no frame is static.
  $('stage').style.backgroundPosition = `${Math.sin(f / 90) * 12}px ${Math.cos(f / 110) * 10}px`;

  // Act 1 — breathing orb (inhale grows, exhale softens), then collapse into the card's eye.
  let orbScale;
  if (f < -40) orbScale = 0.62 + 0.04 * Math.sin((f + 40) / 40);
  else if (f < T.exhaleTurn) orbScale = mix(0.62, 1.0, prog(f, -40, T.exhaleTurn, E.smooth));
  else if (f < T.breathEnd) orbScale = mix(1.0, 0.7, prog(f, T.exhaleTurn, T.breathEnd, E.smooth));
  else orbScale = lmix(0.7, 0.225, prog(f, T.breathEnd, T.cardIn + 54, E.inOut)); // to iris radius 45 px
  const orbFade = 1 - prog(f, T.cardIn + 48, T.cardIn + 66, E.smooth);
  // Eye centre on the back: (100,168) in a 200x300 box drawn at 600x900 with top 50 px inside the flip box.
  const flipTop = CY - (50 + 168 * 3);
  const eyeY = flipTop + 50 + 504;
  const orbY = mix(CY, eyeY, prog(f, T.breathEnd, T.cardIn + 54, E.inOut));
  place($('orb'), CX - 200 * orbScale, orbY - 200 * orbScale, orbScale);
  $('orb').style.opacity = orbFade;
  const gS = orbScale * 1.9;
  place($('orbglow'), CX - 200 * gS, orbY - 200 * gS, gS);
  $('orbglow').style.opacity = orbFade * (0.6 + 0.4 * Math.sin(f / 18) ** 2);

  fragment($('tInhale'), f, T.inhaleIn, T.exhaleTurn - 24, CX, CY + 360);
  fragment($('tExhale'), f, T.exhaleIn, T.breathEnd - 30, CX, CY + 360);

  // Act 2 — card back rises in under the orb.
  const cIn = prog(f, T.cardIn, T.cardIn + 60, E.out);
  const cardS = mix(0.86, 1, cIn) * (1 + Math.max(0, f - T.cardIn - 60) * 0.00012);
  const flipEl = $('flip');
  flipEl.style.opacity = f < T.cardIn ? 0 : cIn;
  // Act 3 — flip, then Act 4 — shrink to the centre of the fan.
  const toFan = prog(f, T.fanStart, T.fanOpen, E.inOut);
  const sFan = lmix(cardS, 0.44, toFan);
  const fy = mix(flipTop, CY - 60 - 1000 * 0.44, toFan);
  place(flipEl, CX - 300 * sFan, fy + (1 - cIn) * 60 + (1 - sFan) * 0, sFan);
  const flipT = prog(f, T.flip, T.flipEnd, E.inOut);
  const punch = f >= T.flipMid ? Math.exp(-(f - T.flipMid) / 10) * (1 - Math.exp(-(f - T.flipMid) / 2)) : 0;
  $('flipInner').style.transform = `rotateY(${flipT * 180}deg) scale(${1 + punch * 0.05})`;

  fragment($('tPull'), f, T.pullIn, T.pullOut, CX, CY + 600);

  // Sparkles burst from behind the card at the flip midpoint.
  SP.forEach((p) => {
    const t = (f - T.flipMid - p.delay) / 66;
    if (t <= 0 || t >= 1) { p.el.style.opacity = 0; return; }
    const e = E.out(t);
    const x = CX + Math.cos(p.angle) * p.dist * e, y = CY + Math.sin(p.angle) * p.dist * e * 1.25;
    p.el.style.opacity = t < 0.15 ? t / 0.15 : 1 - E.smooth((t - 0.15) / 0.85);
    place(p.el, x - p.size / 2, y - p.size / 2, 0.4 + e * 0.8, `rotate(${e * 90}deg)`);
  });

  // Act 4 — fan of hand-drawn cards spreads behind The Star.
  const fanT = prog(f, T.fanStart + 12, T.fanOpen + 24, E.out);
  const fanOut = prog(f, T.fanOut, T.fanOut + 40, E.inOut);
  const fanRot = (f - T.fanStart) * 0.03;
  [...fanEl.children].forEach((el, i) => {
    const slot = i < 3 ? i - 3 : i - 2; // -3..-1, 1..3 around the centre card
    const ang = slot * 11 * fanT + fanRot * Math.sign(slot);
    const s = 0.4;
    const pivotY = CY + 760; // fan pivot well below the cards
    const r = 820;
    const a = (ang * Math.PI) / 180;
    const x = CX + Math.sin(a) * r * (1 - fanOut * 0.0);
    const y = pivotY - Math.cos(a) * r + fanOut * 0;
    el.style.opacity = fanT * (1 - fanOut);
    el.style.zIndex = 10 - Math.abs(slot);
    place(el, x - 300 * s, y - 500 * s, s, `rotate(${ang}deg)`);
  });
  flipEl.style.zIndex = 20;
  flipEl.style.opacity = (f < T.cardIn ? 0 : cIn) * (1 - fanOut);
  const fanLift = fanOut * 120;
  if (fanOut > 0) {
    [...fanEl.children].forEach((el) => { el.style.translate = `0 ${-fanLift}px`; });
    flipEl.style.translate = `0 ${-fanLift}px`;
  }

  const t78 = $('t78');
  const b = prog(f, T.t78b, T.t78b + 36, E.out);
  t78.innerHTML = `78 cards,<span style="opacity:${b}; color:${b < 1 ? 'var(--hot)' : 'var(--cream)'}"> hand-drawn.</span>`;
  const sw = f > T.t78b + 36 ? prog(f, T.t78b + 36, T.t78b + 60, E.smooth) : 0;
  t78.lastChild && (t78.lastChild.style.color = sw > 0.5 ? 'var(--cream)' : 'var(--hot)');
  fragment(t78, f, T.t78a, T.fanOut - 6, CX, CY + 560, 84);
  // Build line re-centres: start centred on the first fragment, glide to the full line as the second lands.
  const full = t78.offsetWidth, part = full - t78.lastChild.offsetWidth;
  const shift = ((full - part) / 2) * (1 - prog(f, T.t78b - 6, T.t78b + 30, E.soft));
  t78.style.translate = `${shift}px 0`;

  // Act 5 — lockup, tagline, URL; slow creep to the end.
  const L = prog(f, T.lockIn, T.lockSettle, E.out);
  const creep = 1 + Math.max(0, f - T.lockSettle) * 0.00035;
  const lock = $('lockup');
  lock.style.opacity = L;
  place(lock, 540 - 540 * creep, CY - 300 + (1 - L) * 60, creep);
  const mark = $('mark');
  mark.style.transform = `rotate(${(1 - L) * -90}deg) scale(${mix(0.6, 1, L)})`;
  fragment($('tTag'), f, T.tagIn, null, CX, CY + 150, 44);
};
window.ready = document.fonts.ready.then(() => { window.render(0); return true; });
</script>
</body>
</html>
